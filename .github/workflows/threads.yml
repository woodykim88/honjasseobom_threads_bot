name: threads

on:
  schedule:
    # 정시 실행은 Cloudflare 정시 알람(인스타피드 건강뉴스 자동화/scheduler)이 맡고, GitHub cron은 예비로만 둔다 (UTC)
    - cron: '52 3 * * *'   # post 예비(일상글 12:30 슬롯)
    - cron: '22 23,11 * * *'   # post 예비: KST 08:22, 20:22
    - cron: '29 0 * * 1'       # refresh-token: 매주 월 KST 09:29
  workflow_dispatch:
    inputs:
      job:
        description: 'post=지금 게시할 슬롯 게시 / preview=글만 만들기(게시 안 함) / refresh-token=토큰 갱신 / post-pending=미리 보여 준 글 그대로 게시 / reply=새 댓글에 답글'
        type: choice
        options: [preview, post, refresh-token, post-pending, insights, reply]
        default: preview
      hour:
        description: 'preview 전용: 제품 슬롯 시각(혼자써봄은 20)을 넣으면 제품 추천 글, 비우면 뉴스 글'
        type: string
        default: ''

concurrency:
  group: threads
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLISH_TIMES: ${{ vars.PUBLISH_TIMES || '08:00,20:00' }}
      PAUSED: ${{ vars.PAUSED || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick job
        id: pick
        env:
          CRON: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
        run: |
          case "$CRON" in
            '22 23,11 * * *') JOB=post ;;
            '52 3 * * *') JOB=post ;;
            '29 0 * * 1') JOB=refresh-token ;;
            *) JOB="${INPUT_JOB:-preview}" ;;
          esac
          echo "job=$JOB" >> "$GITHUB_OUTPUT"

      - name: Check due
        id: due
        if: steps.pick.outputs.job == 'post'
        run: python3 scripts/due_check.py

      - uses: actions/setup-python@v5
        if: steps.due.outputs.due != 'false'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        if: steps.due.outputs.due != 'false'
        run: pip install -r requirements-dev.txt

      - name: Run tests
        if: steps.due.outputs.due != 'false'
        run: python -m pytest -q

      - name: Run job
        if: steps.due.outputs.due != 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT_PROVIDER: ${{ vars.TEXT_PROVIDER }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL }}
          FAST_MODEL: ${{ vars.FAST_MODEL }}
          HOUR: ${{ inputs.hour }}
        run: python -m src.main --job ${{ steps.pick.outputs.job }} ${HOUR:+--hour "$HOUR"}

      - name: Upload preview
        if: always() && steps.pick.outputs.job == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit records
        if: always() && steps.due.outputs.due != 'false' && steps.pick.outputs.job != 'preview'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "기록 변경 없음"; else
            git commit -m "chore: update threads records [skip ci]"; git pull --rebase --quiet; git push; fi
